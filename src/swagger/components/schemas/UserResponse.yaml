type: object
properties:
  status:
    type: integer
    example: 201
  message:
    type: string
    example: 'Successfully registered a user!'
  data:
    type: object
    properties:
      _id:
        type: string
        example: '643a12b08ecbf72d75faeda5'
      name:
        type: string
        example: 'John Doe'
      email:
        type: string
        example: 'john.doe@example.com'
      createdAt:
        type: string
        format: date-time
        example: '2023-04-15T10:30:45.123Z'
      updatedAt:
        type: string
        format: date-time
        example: '2023-04-15T10:30:45.123Z'
