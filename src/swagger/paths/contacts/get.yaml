tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: Retrieves a paginated list of all contacts for the authenticated user
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    required: false
    schema:
      type: integer
      default: 1
    description: Page number
  - name: perPage
    in: query
    required: false
    schema:
      type: integer
      default: 10
    description: Number of items per page
  - name: sortBy
    in: query
    required: false
    schema:
      type: string
      default: 'name'
    description: Field to sort by
  - name: sortOrder
    in: query
    required: false
    schema:
      type: string
      enum: [asc, desc]
      default: 'asc'
    description: Sort order (ascending or descending)
  - name: type
    in: query
    required: false
    schema:
      type: string
      enum: [work, home, personal]
    description: Filter contacts by type
responses:
  '200':
    description: Contacts successfully retrieved
    content:
      application/json:
        schema:
          $ref: ../../components/responses/200.yaml
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: ../../components/responses/401.yaml
