tags:
  - Contacts
summary: Delete a contact
operationId: deleteContact
description: Deletes a specific contact by ID
security:
  - bearerAuth: []
responses:
  '204':
    description: Contact successfully deleted
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: 'Contact not found'

  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: 'Unauthorized'
