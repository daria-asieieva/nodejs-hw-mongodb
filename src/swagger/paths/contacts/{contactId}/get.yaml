tags:
  - Contacts
summary: Get a contact by ID
operationId: getContactById
description: Retrieves a specific contact by its ID
security:
  - bearerAuth: []
responses:
  '200':
    description: Contact successfully retrieved
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Contact successfully retrieved.'
            data:
              type: object
              example: {}
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: 'Contact not found'

  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: 'Unauthorized'
