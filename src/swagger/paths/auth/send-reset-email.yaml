post:
  security: []
  tags:
    - Authentication
  summary: Send password reset email
  operationId: sendResetEmail
  description: Sends an email with a password reset link
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            email:
              type: string
              format: email
              example: 'john.doe@example.com'
          required:
            - email
  responses:
    '200':
      description: Reset email successfully sent
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: 'Reset password email has been successfully sent.'
              data:
                type: object
                example: {}
    '404':
      description: User not found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 404
              message:
                type: string
                example: 'User not found'
    '500':
      description: Email sending failed
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 500
              message:
                type: string
                example: 'Something went wrong'
              data:
                type: string
                example: 'Error details'
