post:
  security: []
  tags:
    - Authentication
  summary: Login to the application
  operationId: loginUser
  description: Authenticates a user and returns an access token
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            email:
              type: string
              format: email
              example: 'john.doe@example.com'
            password:
              type: string
              format: password
              example: 'password123'
          required:
            - email
            - password
  responses:
    '200':
      description: User successfully logged in
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: 'Successfully logged in a user!'
              data:
                type: object
                properties:
                  accessToken:
                    type: string
                    description: JWT access token for the user
                    example: 'n1IiOgOQDeYgt0GHLY/8yJu3Bin3WZHcVT+J+jFB'
      headers:
        Set-Cookie:
          schema:
            type: string
            example: refreshToken=abc123; HttpOnly; Max-Age=2592000; SameSite=None; Secure
    '401':
      description: Invalid credentials
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 401
              message:
                type: string
                example: 'Unauthorized'
              data:
                type: string
                example: 'Invalid email or password'
