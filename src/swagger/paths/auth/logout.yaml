post:
  security: []
  tags:
    - Authentication
  summary: Logout from the application
  operationId: logoutUser
  description: Invalidates the current session
  responses:
    '204':
      description: Successfully logged out
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 401
              message:
                type: string
                example: 'Unauthorized'