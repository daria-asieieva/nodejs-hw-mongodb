post:
  security: []
  tags:
    - Authentication
  summary: Refresh access token
  operationId: refreshToken
  description: Get a new access token using a refresh token
  responses:
    '200':
      description: Token successfully refreshed
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: 'Successfully refreshed token!'
              data:
                type: object
                properties:
                  accessToken:
                    type: string
                    description: New JWT access token
                    example: 'n1IiOgOQDeYgt0GHLY/8yJu3Bin3WZHcVT+J+jFB'
      headers:
        Set-Cookie:
          schema:
            type: string
            example: refreshToken=new123; HttpOnly; Max-Age=2592000; SameSite=None; Secure
    '401':
      description: Invalid or expired refresh token
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 401
              message:
                type: string
                example: 'Invalid or expired refresh token'
