post:
  security: []
  tags:
    - Authentication
  summary: Reset password
  operationId: resetPassword
  description: Resets a user's password using a token from the reset email
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            token:
              type: string
              example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
            password:
              type: string
              format: password
              example: 'newPassword123'
          required:
            - token
            - password
  responses:
    '200':
      description: Password successfully reset
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: 'Password has been successfully reset.'
              data:
                type: object
                example: {}
    '401':
      description: Invalid or expired token
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 401
              message:
                type: string
                example: 'Unauthorized'
    '404':
      description: User not found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 404
              message:
                type: string
                example: 'User not found'
