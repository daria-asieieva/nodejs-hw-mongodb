post:
  security: []
  tags:
    - Authentication
  summary: Register a new user
  operationId: registerUser
  description: Creates a new user account
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/User.yaml'
  responses:
    '201':
      description: User successfully registered
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 201
              message:
                type: string
                example: 'Successfully registered a user!'
              data:
                $ref: '../../components/schemas/User.yaml'
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 400
              message:
                type: string
                example: 'Something went wrong'
              data:
                type: string
                example: '"email" is required, "emai" is not allowed'
    '409':
      description: Email already in use
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 409
              message:
                type: string
                example: 'Something went wrong'
              data:
                type: string
                example: 'Email in use'
